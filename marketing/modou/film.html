<script>
const T = { s: [0.6, 7.2, 17.4, 22.0, 26.4, 35.2, 45.4, 53.6], d: [5.6, 9.4, 3.6, 3.6, 8.0, 9.4, 7.4, 4.6], duration: 61 };
let CAPS = [];
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = (k) => 1 - Math.pow(1 - clamp(k), 3);          // sortie douce
const eio = (k) => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const back = (k) => { k = clamp(k); const c = 1.5; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const win = (t, a, b, f = 0.35) => clamp(Math.min((t - a) / f, (b - t) / f));  // 0→1→0 sur [a,b]
const prog = (t, a, d) => clamp((t - a) / d);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function use(href, x, y, parent, s = 1) { return el("use", { href: "#" + href, transform: `translate(${x},${y}) scale(${s})` }, parent); }

// ---------- Personnages ----------
const MODOU = { skin: "#6B4226", hair: "#1A1410", beard: "#1A1410", robe: "#2F7DC9", trim: "#F6B800", dot: "#F6B800" };
const IBOU = { skin: "#4E2F1B", hair: "#141010", beard: "none", robe: "#2B9A66", trim: "#FFFDF7", dot: "#FFFDF7" };
function person(root, c, opts = {}) {
  root.innerHTML = "";
  const g = el("g", {}, root);
  const armBack = el("g", {}, g);
  el("path", { d: "M0,0 Q-40,90 -30,200 L10,206 Q8,110 40,20Z", fill: c.robe, transform: "translate(118,-70)" }, armBack);
  const body = el("g", {}, g);
  body.innerHTML = $("pBody").innerHTML; // copie (les styles par classe ne traversent pas un <use>)
  const st = el("style", {}, g);
  const id = root.id;
  st.textContent = `#${id} .skin{fill:${c.skin}} #${id} .hair{fill:${c.hair}} #${id} .beard{fill:${c.beard}} #${id} .robe{fill:${c.robe}} #${id} .trim{fill:${c.trim}} #${id} .trimLine{stroke:${c.trim}} #${id} .trimDot{fill:${c.dot}}`;
  const head = el("g", { transform: "translate(0,-230)" }, g);
  head.innerHTML = $("pHead").innerHTML + (opts.cap ? `<path d="M-84,-80 Q-80,-158 0,-160 Q80,-158 84,-80 Z" fill="#E9E2D0"/><path d="M-84,-80 L84,-80" stroke="#C9BFA6" stroke-width="8"/>` : "");
  const eyes = el("g", {}, head);
  const eyeL = el("ellipse", { cx: -34, cy: -18, rx: 13, ry: 15, fill: "#fff" }, eyes), eyeR = el("ellipse", { cx: 34, cy: -18, rx: 13, ry: 15, fill: "#fff" }, eyes);
  const pupL = el("circle", { cx: -34, cy: -16, r: 8, fill: "#1A1410" }, eyes), pupR = el("circle", { cx: 34, cy: -16, r: 8, fill: "#1A1410" }, eyes);
  const lidL = el("rect", { x: -50, y: -36, width: 32, height: 0, fill: c.skin }, eyes), lidR = el("rect", { x: 18, y: -36, width: 32, height: 0, fill: c.skin }, eyes);
  const browL = el("path", { d: "", stroke: c.hair, "stroke-width": 9, "stroke-linecap": "round", fill: "none" }, head);
  const browR = el("path", { d: "", stroke: c.hair, "stroke-width": 9, "stroke-linecap": "round", fill: "none" }, head);
  el("path", { d: "M-6,6 Q0,26 10,22", stroke: "#4A2C18", "stroke-width": 5, fill: "none", "stroke-linecap": "round" }, head);
  const mouth = el("path", { d: "", fill: "#3A1A12", stroke: "#3A1A12", "stroke-width": 5, "stroke-linejoin": "round" }, head);
  const arm = el("g", { transform: "translate(-118,-70)" }, g);
  const armRot = el("g", {}, arm);
  el("path", { d: "M0,0 Q40,90 30,200 L-10,206 Q-8,110 -40,20Z", fill: c.robe }, armRot);
  const handG = el("g", { transform: "translate(10,206)" }, armRot);
  el("circle", { r: 30, fill: c.skin }, handG);
  const prop = el("g", {}, handG);
  return { g, head, eyes, lidL, lidR, pupL, pupR, browL, browR, mouth, armRot, handG, prop, body };
}
// mood : -1 inquiet … +1 heureux ; talk : 0…1 ouverture ; look : -1…1
function face(p, t, { mood = 0, talk = 0, look = 0, blinkSeed = 0, tilt = 0, nod = 0 }) {
  const lift = 10 * mood;
  const inner = -10 * mood;   // inquiet : intérieur des sourcils relevé
  p.browL.setAttribute("d", `M-58,${-52 - lift} Q-38,${-62 - lift + (mood < 0 ? -6 : 0)} -16,${-52 + inner}`);
  p.browR.setAttribute("d", `M16,${-52 + inner} Q38,${-62 - lift + (mood < 0 ? -6 : 0)} 58,${-52 - lift}`);
  const w = 34, curve = 24 * mood, open = 26 * talk;
  if (open > 2) p.mouth.setAttribute("d", `M${-w * .7},42 Q0,${42 + open * 2 + curve * .3} ${w * .7},42 Q0,${44 - 4} ${-w * .7},42Z`);
  else p.mouth.setAttribute("d", `M${-w},${44 - curve * .25} Q0,${44 + curve} ${w},${44 - curve * .25}`);
  p.mouth.setAttribute("fill", open > 2 ? "#3A1A12" : "none");
  // clignements

  $("ps-app").setAttribute("opacity", appOn ? 1 : 0);
  const splash = clamp(1 - (pt - 4.4) / 0.4);
  $("appSplash").setAttribute("opacity", splash); $("appSplashLogo").setAttribute("opacity", splash);
  $("appSplashLogo").setAttribute("transform", `translate(0,0)`);
  // écran Jokko : l'image glisse doucement
  $("appShot").setAttribute("y", -470 - (result ? clamp((t - r5) / 2.5) * 56 : 0));

  // --- scène 6 : cartes puis maison
  const a6 = sc(5), mid6 = S[5] + 4.55, b6 = sc(6);
  $("clear").setAttribute("opacity", win(t, a6, mid6, 0.35));
  $("cards").list.forEach((g, i) => {
    const k = back((t - a6 - 0.2 - i * 0.55) / 0.5);
    g.setAttribute("transform", `translate(${540 + (1 - clamp(k)) * 900},${430 + i * 330}) scale(${0.9 + 0.1 * clamp(k)})`);
    g.ok.setAttribute("transform", `translate(350,-10) scale(${back((t - a6 - 0.8 - i * 0.55) / 0.35)})`);
  });
  $("home").setAttribute("opacity", win(t, mid6, b6, 0.35));
  const ht = t - mid6;
  const buzz = ht > 1.0 && ht < 1.6 ? Math.sin(ht * 80) * 3 : 0;
  face(modouHome, t, { mood: lerp(0.2, 1, eo((ht - 1.6) / 0.5)), look: 0.2, tilt: 2 + buzz * 0.3, blinkSeed: 0.6 });
  modouHome.armRot.setAttribute("transform", `rotate(${lerp(20, 112, eo((ht - 1.0) / 0.5)) + buzz})`);
  $("notif").setAttribute("opacity", ht > 1.2 ? clamp((ht - 1.2) / 0.3) : 0);
  $("notif").setAttribute("transform", `translate(540,${lerp(250, 420, eo((ht - 1.2) / 0.45))})`);
  $("home").setAttribute("transform", `translate(540,960) scale(${lerp(1.0, 1.06, eio(ht / 5))}) translate(-540,-960)`);

  // --- scène 7 : fin du mois
  const a7 = sc(6), b7 = S[6] + 4.4;
  $("month").setAttribute("opacity", win(t, a7, b7, 0.35));
  const mt = t - a7;
  $("calDay").textContent = mt < 0.7 ? "28" : mt < 1.2 ? "29" : "30";
  $("calendar").setAttribute("transform", `translate(380,470) scale(${1 + (mt > 0.7 && mt < 0.85 ? 0.06 : 0) + (mt > 1.2 && mt < 1.35 ? 0.06 : 0)})`);
  const pk = eo((mt - 1.6) / 1.6);
  $("profitNum").textContent = `${Math.round(185000 * pk).toLocaleString("fr-FR").replace(/ /g, " ")} F`;
  $("bars").list.forEach(([r, v], i) => { const k = eo((mt - 1.6 - i * 0.12) / 0.7); r.setAttribute("height", v * k); r.setAttribute("y", 230 - v * k); });
  face(modouMonth, t, { mood: lerp(0.3, 1, eo((mt - 2.6) / 0.5)), look: -0.6, tilt: -4, blinkSeed: 2.2 });
  modouMonth.armRot.setAttribute("transform", `rotate(${lerp(0, 150, eo((mt - 3.0) / 0.5))})`);
  $("modouMonth").setAttribute("transform", `translate(${lerp(1300, 820, eo((mt - 2.2) / 0.7))},640) scale(.62)`);

  // --- scène 8 : logo
  const a8 = S[6] + 4.0;
  $("end").setAttribute("opacity", clamp((t - a8) / 0.4));
  const et = t - a8;
  $("endLogo").setAttribute("transform", `translate(540,760) scale(${back(et / 0.55)}) translate(-540,-760)`);
  $("endRing").setAttribute("r", Math.max(0, 300 * eo(et / 0.6) + Math.sin(t * 2) * 6));
  for (const [id, d] of [["endName", 0.35], ["endTag", 0.55], ["endPills", 0.85], ["endCfc", 1.3]]) {
    const k = eo((et - d) / 0.5); $(id).setAttribute("opacity", k); $(id).setAttribute("transform", `translate(0,${(1 - k) * 40})`);
  }

  // --- accroche (3 premières secondes) et sous-titres
  const hk = $("hook");
  hk.style.opacity = win(t, 0, 4.2, 0.35);
  hk.style.transform = `translateY(${(1 - eo(t / 0.6)) * 40}px)`;
  caption(t < S[6] + 4.6 ? t : -1);
}
$("hook").innerHTML = "Ndax xam nga<br><em>lu ngay am ?</em><small>Tu sais ce que tu gagnes ?</small>";
window.seek = seek;
fetch("timing.json").then((r) => r.json()).then((j) => Object.assign(T, j)).catch(() => {}).then(() => fetch("script.json")).then((r) => r.json()).then((j) => { CAPS = j; }).catch(() => {}).finally(() => {
  seek(0);
  document.fonts.ready.then(() => { window.READY = true; });
  if (!location.search.includes("render")) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % T.duration); requestAnimationFrame(loop); }; loop(); }
});
