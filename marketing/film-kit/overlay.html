<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
  @font-face{font-family:"Brico";src:url(Bricolage.ttf);font-weight:200 800;}
  @font-face{font-family:"Serif";src:url(InstrumentItalic.ttf);font-style:italic;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:"Brico",sans-serif}
  .stage{position:absolute;inset:0;perspective:1600px;perspective-origin:62% 46%}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,12,.42) 0%,rgba(8,9,12,0) 22%),linear-gradient(0deg,rgba(8,9,12,.88) 0%,rgba(8,9,12,.35) 30%,rgba(8,9,12,0) 50%)}
  .brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:18px}
  .brand .j{width:70px;height:70px;border-radius:20px;background:#17191F;display:grid;place-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
  .brand .j svg{width:42px;height:42px}
  .brand b{color:#fff;font-size:30px;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .device{position:absolute;top:50%;left:50%;width:400px;height:840px;transform-style:preserve-3d;margin:-470px 0 0 90px}
  .frame{position:absolute;inset:0;border-radius:56px;background:linear-gradient(150deg,#23262d,#0d0f13);padding:15px;box-shadow:0 70px 110px -30px rgba(0,0,0,.85),0 0 0 2px rgba(255,255,255,.07) inset}
  .scr{width:100%;height:100%;border-radius:43px;background-size:cover;background-position:top center}
  .glow{position:absolute;inset:-40px;border-radius:80px;background:radial-gradient(ellipse at 50% 40%,rgba(246,184,0,.25),transparent 62%);filter:blur(28px);z-index:-1}
  .callout{position:absolute;top:430px;left:64px;display:flex;align-items:center;gap:16px;background:rgba(23,25,31,.84);border:2px solid rgba(246,184,0,.4);border-radius:999px;padding:16px 26px 16px 16px}
  .callout .m{width:48px;height:48px;border-radius:50%;background:#F6B800;display:grid;place-items:center}
  .callout .m svg{width:25px;height:25px}
  .callout span{font-family:"Serif";font-style:italic;color:#fff;font-size:33px;white-space:nowrap}
  .copy{position:absolute;left:64px;right:64px;bottom:150px}
  .kick{font-size:30px;font-weight:800;letter-spacing:6px;text-transform:uppercase;color:#F6B800;margin-bottom:16px;overflow:hidden}
  .kick i,.ln i{display:block;font-style:normal}
  .title{font-size:90px;font-weight:800;line-height:.98;letter-spacing:-3px;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.55)}
  .title em{font-family:"Serif";font-style:italic;font-weight:400;color:#F6B800;letter-spacing:0}
  .ln{overflow:hidden;display:block}
  .center .copy{bottom:auto;top:50%;transform:translateY(-50%);text-align:center}
  .center .title{font-size:96px}
  .end{position:absolute;inset:0;background:radial-gradient(ellipse 92% 62% at 50% 40%,#FFF4CF 0%,#F7EFDD 55%,#EDE3CE 100%);display:none;flex-direction:column;align-items:center;justify-content:center}
  .end .logo{width:170px;height:170px;border-radius:46px;background:#17191F;display:grid;place-items:center;margin-bottom:56px;box-shadow:0 30px 70px -24px rgba(23,25,31,.5)}
  .end .logo svg{width:104px;height:104px}
  .end h1{font-size:92px;font-weight:800;color:#17191F;text-align:center;line-height:.98;letter-spacing:-2.5px}
  .end h1 em{font-family:"Serif";font-style:italic;font-weight:400;color:#D99A00}
  .end .url{margin-top:90px;font-size:62px;font-weight:800;color:#17191F}
  .end .wol{margin-top:22px;font-family:"Serif";font-style:italic;font-size:40px;color:#8A6400}
</style></head>
<body>
<div class="stage" id="stage">
  <div class="shade" id="shade"></div>
  <div class="brand" id="brand"><span class="j"><svg viewBox="0 0 48 48" fill="none"><path d="M30 10v20a8 8 0 0 1-8 8 8 8 0 0 1-8-6" stroke="#F6B800" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="10" r="4" fill="#F6B800"/></svg></span><b>Jokko</b></div>
  <div class="callout" id="callout"><span class="m"><svg viewBox="0 0 24 24" fill="none" stroke="#17191F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg></span><span id="ctext"></span></div>
  <div class="device" id="device"><div class="glow"></div><div class="frame"><div class="scr" id="scr"></div></div></div>
  <div class="copy"><div class="kick"><i id="kick"></i></div><div class="title"><span class="ln"><i id="l1"></i></span><span class="ln"><i id="l2"></i></span></div></div>
  <div class="end" id="end"><div class="logo"><svg viewBox="0 0 48 48" fill="none"><path d="M30 10v20a8 8 0 0 1-8 8 8 8 0 0 1-8-6" stroke="#F6B800" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="10" r="4" fill="#F6B800"/></svg></div><h1>Un Jokko<br><em>pour chaque métier.</em></h1><div class="url">jokkoapp.com</div><div class="wol">« Wax rekk, Jokko bind »</div></div>
</div>
<script>
// Paramètres dans l'adresse : #{"screen":"...","kick":"...","l1":"...","l2":"...","callout":"...","mode":"phone|text|center|end","dur":5}
const P=JSON.parse(decodeURIComponent(location.hash.slice(1)||'{}'));
const $=id=>document.getElementById(id);
const mode=P.mode||'phone', DUR=P.dur||5;
$('kick').textContent=P.kick||''; $('l1').textContent=P.l1||''; $('l2').innerHTML=P.l2?'<em>'+P.l2+'</em>':'';
if(P.screen) $('scr').style.backgroundImage='url(screens/'+P.screen+')';
if(P.callout) $('ctext').textContent=P.callout; else $('callout').style.display='none';
if(mode!=='phone') $('device').style.display='none';
if(mode==='center') document.body.classList.add('center');
if(mode==='end'){ $('end').style.display='flex'; ['shade','brand','callout','device'].forEach(i=>$(i).style.display='none'); document.querySelector('.copy').style.display='none'; }
const ease=x=>x<=0?0:x>=1?1:1-Math.pow(1-x,3);
const eio=x=>x<0?0:x>1?1:(x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const back=x=>{const c=1.7;x=Math.min(1,Math.max(0,x));return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const seg=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a)));
window.seek=function(t){
  const out=ease(seg(t,DUR-0.35,DUR));            // sortie douce
  $('brand').style.opacity=ease(seg(t,0.1,0.6))*(1-out);
  $('shade').style.opacity=ease(seg(t,0,0.4));
  const e=eio(seg(t,0.35,1.5));
  const bob=Math.sin(t*1.5)*6*seg(t,1.2,2);
  $('device').style.opacity=ease(seg(t,0.35,0.8))*(1-out);
  $('device').style.transform=`translateY(${bob}px) rotateY(${-46+30*e}deg) rotateX(${10-7*e}deg) translateX(${260*(1-e)}px) translateZ(${-240*(1-e)}px)`;
  const c=eio(seg(t,1.0,1.5)); $('callout').style.opacity=ease(seg(t,1.0,1.35))*(1-out); $('callout').style.transform=`scale(${.7+.3*c})`;
  $('kick').style.transform=`translateY(${(1-eio(seg(t,0.5,1.0)))*110}%)`;
  $('l1').style.transform=`translateY(${(1-eio(seg(t,0.65,1.25)))*110}%)`;
  $('l2').style.transform=`translateY(${(1-eio(seg(t,0.85,1.45)))*110}%)`;
  document.querySelector('.copy').style.opacity=1-out;
  if(mode==='end'){ const s=back(seg(t,0.1,0.9)); document.querySelector('.end .logo').style.transform=`scale(${.4+.6*s})`; const h=ease(seg(t,0.5,1.2)); document.querySelector('.end h1').style.opacity=h; document.querySelector('.end .url').style.opacity=ease(seg(t,1.4,2)); document.querySelector('.end .wol').style.opacity=ease(seg(t,2,2.6)); $('end').style.opacity=ease(seg(t,0,0.4)); }
};
document.fonts.ready.then(()=>{window.seek(0);window.READY=true;});
</script>
</body></html>
