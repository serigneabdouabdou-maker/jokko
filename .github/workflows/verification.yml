# Vérification automatique : à chaque envoi de code, GitHub installe le projet,
# lance les tests, vérifie les types et construit l'appli.
# Sur la branche main, si tout est bon, l'appli est publiée sur GitHub Pages.
name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Types
        run: npm run typecheck
      - name: Construction de l'appli
        run: npx vite build
        env:
          JOKKO_BASE: /jokko/
      - name: Vérifier l'appli installable
        run: |
          grep -q 'rel="manifest" href="/jokko/manifest.webmanifest"' dist/index.html
          grep -q 'apple-touch-icon" href="/jokko/apple-touch-icon.png"' dist/index.html
          test -f dist/sw.js && test -f dist/manifest.webmanifest && test -f dist/icon-512.png && test -f dist/icon-maskable-512.png
          node -e "const m=require('./dist/manifest.webmanifest.json')" 2>/dev/null || node -e "JSON.parse(require('fs').readFileSync('dist/manifest.webmanifest','utf8'))"
          echo "Appli installable : OK"
      - name: Préparer la publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publication:
    needs: verification
    # Une seule publication à la fois : la suivante attend la précédente.
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
