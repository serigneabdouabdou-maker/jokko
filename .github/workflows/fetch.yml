name: Medias
on:
  push:
    branches: [medias]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger les fichiers publics listes dans urls.txt
        run: |
          mkdir -p files
          while read -r url; do
            [ -z "$url" ] && continue
            case "$url" in https://solocpbqtqlxdfpjiewm.supabase.co/storage/v1/object/public/*|https://sunubulletin.com/*|https://mbosssmartmap.com/*|https://www.mbosssmartmap.com/*|https://www.sil.org/system/files/*|https://senprof.education.sn/*|https://huggingface.co/api/datasets/*|https://huggingface.co/datasets/*/resolve/*) ;; *) echo "refuse $url"; continue;; esac
            name=$(echo "$url" | sed 's#^https://##; s#[^A-Za-z0-9._-]#_#g')
            curl -fsSL -m 60 -o "files/$name" "$url" && echo "ok $name" || echo "echec $url"
          done < urls.txt
      - name: Enregistrer
        run: |
          git config user.name "medias-bot"; git config user.email "medias-bot@users.noreply.github.com"
          git add files && git commit -m "Fichiers telecharges" && git push || echo "rien de neuf"
