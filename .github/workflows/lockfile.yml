name: Lockfile
on:
  push:
    branches: [outils-lock]
permissions:
  contents: write
jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, 'lockfile regenere') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerer package-lock.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund
          npm ci --dry-run --no-audit --no-fund > /dev/null
      - name: Enregistrer
        run: |
          git config user.name "lock-bot"; git config user.email "lock-bot@users.noreply.github.com"
          git add package-lock.json && git commit -m "lockfile regenere" && git push || echo "rien de neuf"
