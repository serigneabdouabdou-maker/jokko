<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jokko</title>
<style>
  html,body{margin:0;height:100%;background:#FFFDF7;color:#17191F;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box}
  .mark{width:84px;height:84px;border-radius:22px;background:#0A1F44;display:grid;place-items:center;color:#fff;font-size:46px;font-weight:800}
  h1{font-size:22px;margin:6px 0 0}
  p{margin:0;max-width:320px;line-height:1.45;color:#4a4d55}
  button{margin-top:10px;height:48px;padding:0 26px;border-radius:999px;border:0;background:#F6B800;color:#17191F;font:inherit;font-weight:700;font-size:16px}
  small{color:#7a7d85;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">J</div>
  <h1>Pas de connexion internet</h1>
  <p>Jokko a besoin d’internet pour s’ouvrir. Vérifie le Wi-Fi ou les données mobiles, puis réessaie.</p>
  <p lang="wo"><b>Amul internet.</b> Seetal sa Wi-Fi walla sa connexion, te jéemaat.</p>
  <button type="button" onclick="location.href='https://jokkoapp.com/'">Réessayer</button>
  <small>Jokko · CFC – Cissé Family Company</small>
</main>
<script>
  window.addEventListener("online", function () { location.href = "https://jokkoapp.com/"; });
</script>
</body>
</html>
